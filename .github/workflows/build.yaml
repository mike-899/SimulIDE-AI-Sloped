name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (AppImage + tar.gz)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential qtbase5-dev qtbase5-dev-tools qttools5-dev-tools \
            qtmultimedia5-dev libqt5serialport5-dev libqt5svg5-dev qtscript5-dev \
            libelf-dev libgl-dev libx11-dev libxkbcommon-x11-dev libpulse-dev \
            libfuse2t64 file desktop-file-utils

      - name: Read version
        id: ver
        run: |
          V=$(sed -n 's/^VERSION *= *"\(.*\)"/\1/p' SimulIDE.pro)
          R=$(sed -n 's/^RELEASE *= *"\(.*\)"/\1/p' SimulIDE.pro)
          echo "version=${V}${R}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          mkdir build
          cd build
          qmake ..
          make -j"$(nproc)"

      - name: Locate build output
        run: |
          OUT=$(ls -d build/release/SimulIDE_*/ | head -n1)
          echo "OUT=${OUT%/}" >> "$GITHUB_ENV"
          ls -R "$OUT" | head -50

      - name: Create AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          NO_STRIP: '1'
          QMAKE: /usr/lib/qt5/bin/qmake
          EXTRA_QT_PLUGINS: svg;multimedia
        run: |
          set -e
          # The app looks for ../share/simulide relative to its binary,
          # so the AppDir keeps the same bin/ + share/ layout.
          mkdir -p AppDir/usr
          cp -a "$OUT/bin" AppDir/usr/bin
          cp -a "$OUT/share" AppDir/usr/share
          install -Dm644 resources/icons/hicolor/256x256/simulide.png \
            AppDir/usr/share/icons/hicolor/256x256/apps/simulide.png
          BASE=https://github.com/linuxdeploy
          curl -fsSL -o linuxdeploy "$BASE/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage"
          curl -fsSL -o linuxdeploy-plugin-qt "$BASE/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage"
          chmod +x linuxdeploy linuxdeploy-plugin-qt
          ./linuxdeploy --appdir AppDir \
            --executable AppDir/usr/bin/simulide \
            --desktop-file packaging/linux/simulide.desktop \
            --icon-file resources/icons/hicolor/256x256/simulide.png \
            --plugin qt --output appimage
          mkdir -p dist
          mv SimulIDE*.AppImage "dist/SimulIDE-${{ steps.ver.outputs.version }}-x86_64.AppImage"

      - name: Create tar.gz
        run: |
          mkdir -p dist
          tar -C "$OUT" -czf "dist/SimulIDE-${{ steps.ver.outputs.version }}-linux-x86_64.tar.gz" bin share
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: simulide-linux
          path: dist/*
          if-no-files-found: error

  windows:
    name: Windows (installer + portable zip)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            make
            zip
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-qt5-base
            mingw-w64-x86_64-qt5-multimedia
            mingw-w64-x86_64-qt5-serialport
            mingw-w64-x86_64-qt5-svg
            mingw-w64-x86_64-qt5-script
            mingw-w64-x86_64-qt5-tools
            mingw-w64-x86_64-libelf
            mingw-w64-x86_64-nsis

      - name: Read version
        id: ver
        run: |
          V=$(sed -n 's/^VERSION *= *"\(.*\)"/\1/p' SimulIDE.pro)
          R=$(sed -n 's/^RELEASE *= *"\(.*\)"/\1/p' SimulIDE.pro)
          echo "version=${V}${R}" >> "$GITHUB_OUTPUT"
          echo "numver=${V}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          export PATH="/mingw64/qt5/bin:$PATH"
          QMAKE=$(command -v qmake-qt5 || command -v qmake)
          echo "Using $QMAKE"
          mkdir build
          cd build
          "$QMAKE" ..
          make -j"$(nproc)"

      - name: Assemble distribution
        run: |
          set -e
          export PATH="/mingw64/qt5/bin:$PATH"
          OUT=$(ls -d build/release/SimulIDE_*/ | head -n1)
          OUT=${OUT%/}
          rm -rf dist-root && mkdir -p dist-root/SimulIDE dist
          cp -a "$OUT/bin" dist-root/SimulIDE/bin
          cp -a "$OUT/share" dist-root/SimulIDE/share
          cp LICENSE dist-root/SimulIDE/
          cd dist-root/SimulIDE
          WDQ=$(command -v windeployqt || command -v windeployqt-qt5)
          "$WDQ" --release --no-translations --no-opengl-sw bin/simulide.exe
          # Copy remaining MinGW runtime DLLs (a DLL can pull in more DLLs)
          for pass in 1 2 3; do
            find bin \( -name '*.dll' -o -name '*.exe' \) | while read -r f; do
              ldd "$f" | awk '/=> \/mingw64\//{print $3}'
            done | sort -u | while read -r dll; do
              [ -e "bin/$(basename "$dll")" ] || cp -v "$dll" bin/
            done
          done
          ls bin

      - name: Portable zip
        run: |
          cd dist-root
          zip -rq "../dist/SimulIDE-${{ steps.ver.outputs.version }}-win64-portable.zip" SimulIDE

      - name: NSIS installer
        run: |
          makensis -V2 \
            -DVERSION="${{ steps.ver.outputs.version }}" \
            -DSRCDIR="$(cygpath -w "$PWD/dist-root/SimulIDE")" \
            -DOUTFILE="$(cygpath -w "$PWD/dist/SimulIDE-${{ steps.ver.outputs.version }}-win64-setup.exe")" \
            packaging/windows/simulide.nsi
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: simulide-windows
          path: dist/*
          if-no-files-found: error

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - run: ls -l artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
