<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.2" baseProfile="tiny" width="96" height="96" viewBox="0 0 96 96">
  <!-- L298N dual H-bridge module. Original art, MIT License -->
  <defs>
    <linearGradient id="sink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1c1c1e"/>
      <stop offset="0.5" stop-color="#3a3a3e"/>
      <stop offset="1" stop-color="#18181a"/>
    </linearGradient>
    <linearGradient id="screw" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2f2f2"/>
      <stop offset="1" stop-color="#8e9296"/>
    </linearGradient>
  </defs>
  <!-- PCB -->
  <rect x="1" y="1" width="94" height="94" rx="3" fill="#c8232c" stroke="#8e141b" stroke-width="1"/>
  <circle cx="5.5" cy="5.5" r="2.4" fill="#e8e8e8" stroke="#9a9a9a" stroke-width="0.5"/>
  <circle cx="90.5" cy="5.5" r="2.4" fill="#e8e8e8" stroke="#9a9a9a" stroke-width="0.5"/>
  <circle cx="5.5" cy="72" r="2.4" fill="#e8e8e8" stroke="#9a9a9a" stroke-width="0.5"/>
  <circle cx="90.5" cy="72" r="2.4" fill="#e8e8e8" stroke="#9a9a9a" stroke-width="0.5"/>
  <!-- heatsink with fins -->
  <rect x="24" y="2" width="48" height="30" rx="1" fill="url(#sink)" stroke="#000000" stroke-width="0.6"/>
  <g stroke="#55555b" stroke-width="1.2">
    <line x1="28" y1="3" x2="28" y2="31"/><line x1="33" y1="3" x2="33" y2="31"/>
    <line x1="38" y1="3" x2="38" y2="31"/><line x1="43" y1="3" x2="43" y2="31"/>
    <line x1="48" y1="3" x2="48" y2="31"/><line x1="53" y1="3" x2="53" y2="31"/>
    <line x1="58" y1="3" x2="58" y2="31"/><line x1="63" y1="3" x2="63" y2="31"/>
    <line x1="68" y1="3" x2="68" y2="31"/>
  </g>
  <!-- L298 multiwatt chip -->
  <rect x="30" y="30" width="36" height="14" rx="1" fill="#202022" stroke="#000000" stroke-width="0.5"/>
  <text x="48" y="39.5" text-anchor="middle" font-family="sans-serif" font-size="5" font-weight="bold" fill="#d8d8d8">L298N</text>
  <g stroke="#c0c4c8" stroke-width="1">
    <line x1="33" y1="44" x2="33" y2="48"/><line x1="37" y1="44" x2="37" y2="48"/>
    <line x1="41" y1="44" x2="41" y2="48"/><line x1="45" y1="44" x2="45" y2="48"/>
    <line x1="49" y1="44" x2="49" y2="48"/><line x1="53" y1="44" x2="53" y2="48"/>
    <line x1="57" y1="44" x2="57" y2="48"/><line x1="61" y1="44" x2="61" y2="48"/>
  </g>
  <!-- electrolytic caps -->
  <circle cx="19" cy="62" r="6" fill="#1f3f8f" stroke="#0f2257" stroke-width="0.6"/>
  <circle cx="19" cy="62" r="4" fill="#c9ccd0"/>
  <path d="M19,56 A6,6 0 0 1 25,62 L19,62 Z" fill="#9fb4e6"/>
  <circle cx="77" cy="62" r="6" fill="#1f3f8f" stroke="#0f2257" stroke-width="0.6"/>
  <circle cx="77" cy="62" r="4" fill="#c9ccd0"/>
  <path d="M77,56 A6,6 0 0 1 83,62 L77,62 Z" fill="#9fb4e6"/>
  <!-- 78M05 regulator -->
  <rect x="33" y="54" width="12" height="9" fill="#2a2a2c" stroke="#000000" stroke-width="0.4"/>
  <rect x="34" y="51" width="10" height="3" fill="#b8bcc0"/>
  <!-- 5V enable jumper -->
  <rect x="35" y="80" width="5" height="8" rx="0.5" fill="#111111"/>
  <!-- left motor terminal OUT1/OUT2 -->
  <rect x="1" y="24" width="15" height="32" rx="1" fill="#1c64c8" stroke="#0e3d80" stroke-width="0.6"/>
  <circle cx="8.5" cy="32" r="4.6" fill="url(#screw)" stroke="#555a5e" stroke-width="0.5"/>
  <circle cx="8.5" cy="48" r="4.6" fill="url(#screw)" stroke="#555a5e" stroke-width="0.5"/>
  <line x1="5" y1="32" x2="12" y2="32" stroke="#444444" stroke-width="1.1"/>
  <line x1="5" y1="48" x2="12" y2="48" stroke="#444444" stroke-width="1.1"/>
  <!-- right motor terminal OUT3/OUT4 -->
  <rect x="80" y="24" width="15" height="32" rx="1" fill="#1c64c8" stroke="#0e3d80" stroke-width="0.6"/>
  <circle cx="87.5" cy="32" r="4.6" fill="url(#screw)" stroke="#555a5e" stroke-width="0.5"/>
  <circle cx="87.5" cy="48" r="4.6" fill="url(#screw)" stroke="#555a5e" stroke-width="0.5"/>
  <line x1="84" y1="32" x2="91" y2="32" stroke="#444444" stroke-width="1.1"/>
  <line x1="84" y1="48" x2="91" y2="48" stroke="#444444" stroke-width="1.1"/>
  <!-- power terminal 12V GND 5V -->
  <rect x="2" y="80" width="28" height="15" rx="1" fill="#1c64c8" stroke="#0e3d80" stroke-width="0.6"/>
  <circle cx="8" cy="87.5" r="3.4" fill="url(#screw)" stroke="#555a5e" stroke-width="0.5"/>
  <circle cx="16" cy="87.5" r="3.4" fill="url(#screw)" stroke="#555a5e" stroke-width="0.5"/>
  <circle cx="24" cy="87.5" r="3.4" fill="url(#screw)" stroke="#555a5e" stroke-width="0.5"/>
  <line x1="8" y1="85" x2="8" y2="90" stroke="#444444" stroke-width="0.9"/>
  <line x1="16" y1="85" x2="16" y2="90" stroke="#444444" stroke-width="0.9"/>
  <line x1="24" y1="85" x2="24" y2="90" stroke="#444444" stroke-width="0.9"/>
  <!-- logic header ENA IN1 IN2 IN3 IN4 ENB -->
  <rect x="44" y="84" width="48" height="9" fill="#151515"/>
  <g fill="#e8c25a" stroke="#9c7a20" stroke-width="0.3">
    <rect x="46.5" y="87" width="3" height="3"/><rect x="54.5" y="87" width="3" height="3"/>
    <rect x="62.5" y="87" width="3" height="3"/><rect x="70.5" y="87" width="3" height="3"/>
    <rect x="78.5" y="87" width="3" height="3"/><rect x="86.5" y="87" width="3" height="3"/>
  </g>
  <rect x="45" y="77" width="6" height="7" rx="0.5" fill="#111111"/>
  <rect x="85" y="77" width="6" height="7" rx="0.5" fill="#111111"/>
</svg>
